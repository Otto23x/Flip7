<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 150" width="540" height="150">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="50%" stop-color="#f6c453"/>
      <stop offset="100%" stop-color="#c9922a"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f6c453" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g transform="translate(22, 18)">
    <g transform="rotate(-16 40 110)" filter="url(#sh)">
      <rect x="0" y="16" width="72" height="100" rx="9" fill="#fdfbf5" stroke="#d9d0bd" stroke-width="2"/>
      <text x="9" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#1c1c1c">K</text>
      <text x="36" y="80" font-family="Georgia, serif" font-size="40" fill="#1c1c1c" text-anchor="middle">♠</text>
    </g>
    <g transform="translate(46, 0)" filter="url(#sh)">
      <rect x="0" y="6" width="72" height="100" rx="9" fill="#fdfbf5" stroke="#d9d0bd" stroke-width="2"/>
      <text x="9" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#c62828">7</text>
      <text x="36" y="70" font-family="Georgia, serif" font-size="40" fill="#c62828" text-anchor="middle">♥</text>
    </g>
    <g transform="translate(92, 0) rotate(16 36 110)" filter="url(#sh)">
      <rect x="0" y="16" width="72" height="100" rx="9" fill="#fdfbf5" stroke="#d9d0bd" stroke-width="2"/>
      <text x="9" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#1c1c1c">A</text>
      <text x="36" y="80" font-family="Georgia, serif" font-size="40" fill="#1c1c1c" text-anchor="middle">♣</text>
    </g>
    <circle cx="150" cy="18" r="16" fill="url(#gold)" filter="url(#glow)"/>
    <text x="150" y="25" font-family="sans-serif" font-size="20" font-weight="900" fill="#2b1d00" text-anchor="middle">★</text>
  </g>
  <text x="220" y="88" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="900" fill="url(#gold)" letter-spacing="2" filter="url(#glow)">FILOTTO</text>
  <text x="224" y="114" font-family="sans-serif" font-size="12" font-weight="700" fill="#9aa7bf" letter-spacing="4">RISCHIA · FERMATI · VINCI</text>
</svg>
